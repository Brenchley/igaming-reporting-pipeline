igaming_reporting:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../warehouse.duckdb') }}"
      threads: 4
    prod:
      type: bigquery
      method: oauth            # Cloud Run Job runs as a dedicated service account; no key files
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: analytics
      location: africa-south1  # Johannesburg region, keeps player data in-country
      threads: 8
      job_execution_timeout_seconds: 900
      job_retries: 2
      priority: interactive
