name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install dbt-core dbt-duckdb duckdb flask requests pytest
      - run: pytest -q tests
      - run: make demo          # full pipeline incl. dbt tests + reconciliation on synthetic data
